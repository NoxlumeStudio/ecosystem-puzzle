<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宇宙生態研究所 ～ワシが地球を作り直すんじゃ！～｜生態系パズル</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7e8bc}
#gameViewport{position:absolute;box-sizing:border-box;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html[data-viewport-mode="desktop"] #gameViewport{padding:0}
#gameScreen{position:absolute;display:block;border:0;margin:0;transform-origin:0 0}
#gameScreen[hidden],#orientationNotice[hidden]{display:none!important}
#orientationNotice{position:absolute;inset:0;display:grid;place-items:center;box-sizing:border-box;margin:0;padding:24px;color:#49381f;font:16px/1.6 system-ui,sans-serif;text-align:center}
</style>
</head>
<body>
<div id="gameViewport"><iframe id="gameScreen" title="宇宙生態研究所のゲーム画面" data-src="game.html"></iframe><p id="orientationNotice" role="status" hidden>横画面にしてプレイしてください</p></div>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script src="viewport.js"></script>
</body>
</html>
