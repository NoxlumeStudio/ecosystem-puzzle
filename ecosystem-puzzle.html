/* PNG signals: distinct current-status and short-lived event layers. */
.signal-image{display:inline-block;width:24px;height:24px;object-fit:contain;vertical-align:middle;pointer-events:none;user-select:none;flex:none}
.cell .status-badges{position:absolute;top:0;right:1%;display:flex;gap:2px;z-index:5;pointer-events:none}

.cell .status-badge .signal-image{width:clamp(13px,1.5vw,23px);height:clamp(13px,1.5vw,23px)}
.cell .status-badge small{font-size:clamp(9px,.8vw,12px);font-weight:700;color:#293e30}
.status-labels{display:inline-flex;flex-wrap:wrap;gap:4px;margin:2px 4px 3px 0;vertical-align:middle}.status-labels .status-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 4px;border:1px solid #bac5ad;border-radius:5px;background:#fafbed}.status-labels small{font-size:13px;color:#293e30}
.event-symbol{display:inline-block;vertical-align:middle;margin-right:4px;line-height:1}.event-symbol .signal-image{width:26px;height:26px}
.cell-event{position:absolute;right:2%;top:14%;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;background:#fffdf0ed;border:1px solid #837047;border-radius:6px;box-shadow:0 2px 5px #293e3026;padding:1px;animation:signal-pop var(--event-duration,340ms) ease-out both;transform-origin:top right}
.cell-event .signal-image{width:clamp(22px,3vw,40px);height:clamp(22px,3vw,40px)}.cell-event small{font-size:clamp(9px,.8vw,12px);font-weight:700;line-height:1.2;color:#293e30}
@keyframes signal-pop{0%{opacity:0;transform:translateY(3px) scale(.8)}18%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-3px) scale(.95)}}

const pos=(r,c)=>[r-1,c-1];
const seed=(type,r,c,extra={})=>({type,r:r-1,c:c-1,...extra});

function cellAt(s,r,c){return r>=0&&c>=0&&r<s.size&&c<s.size?s.cells[r*s.size+c]:null;}
function nearby(s,r,c,self=true){return (self?[[0,0],...RULES.directions]:RULES.directions).map(([dr,dc])=>cellAt(s,r+dr,c+dc)).filter(Boolean);}
function animals(s,type){return s.cells.flatMap(c=>c.animal?[c.animal]:[]).filter(a=>!type||a.type===type);}
function slugNear(s,p){return nearby(s,p.r,p.c).some(c=>c.animal?.type==='slug');}
function isShore(s,c){return c.terrain==='soil'&&nearby(s,c.r,c.c,false).some(n=>n.terrain==='water');}
function createInitial(stage,placements={}){
 const s={stageId:stage.id,size:stage.size,turn:0,status:'running',nextId:1,stats:{births:0},deaths:[],cells:[],logs:[{turn:0,events:['配置を選び、開始して連鎖を観察しよう。'],records:[]}]};
 const includes=(xs,r,c)=>(xs||[]).some(p=>p[0]===r&&p[1]===c);

  const occupants=entities.filter(x=>x.r===e.r&&x.c===e.c&&SPECIES[x.type]?.layer!=='terrain');
  if(e.type==='rock'&&occupants.length)throw Error('岩は植物・動物のあるマスには配置できません（'+occupants.map(x=>SPECIES[x.type].name).join('・')+'）');
  if(e.type==='water'&&occupants.some(x=>x.type!=='frog'))throw Error('生息できない地形：水辺には植物やカエル以外の動物を配置できません');

  if(c.terrain==='rock')throw Error('岩の上には植物・動物を配置できません');

function count(s,type){if(type==='bloom')return s.cells.filter(c=>c.plant?.type==='flower'&&c.plant.bloom).length;if(type==='births'||type.startsWith('stat:'))return s.stats[type==='births'?'births':type.slice(5)]||0;return s.cells.filter(c=>c.plant?.type===type||c.animal?.type===type||c.terrain===type).length;}
function conditions(s,st){return st.goals.map(g=>({...g,current:count(s,g.type),met:g.min?count(s,g.type)>=g.value:count(s,g.type)===g.value}));}
function placementEntries(st,p={}){
 if(!st.pool)return (st.slots||[]).filter(x=>p[x.id]).map(x=>{const q=p[x.id];if(!x.allowed.some(a=>a[0]===q[0]&&a[1]===q[1]))throw Error('許可されていない配置');return {type:x.type,r:q[0],c:q[1],slotId:x.id};});

}
function deploymentStatus(st,p={}){const entries=placementEntries(st,p),used={};for(const e of entries)used[e.type]=(used[e.type]||0)+1;return {total:entries.length,min:st.deployment?.min||0,max:st.deployment?.max||st.slots.length,used};}
function completePlacement(st,p){try{createInitial(st,p);const d=deploymentStatus(st,p);return st.pool?d.total>=d.min&&d.total<=d.max:st.slots.every(x=>p[x.id]);}catch{return false;}}
// Breadth-first search: ties are resolved by the shared up/right/down/left order.
function foodPath(s,a,predicate,max=4,prey=false){

 for(let i=0;i<queue.length;i++){const node=queue[i];if(node.path.length>=max)continue;for(const c of nearby(s,node.cell.r,node.cell.c,false)){const key=c.r+','+c.c;if(seen.has(key)||c.terrain!=='soil')continue;seen.add(key);const found=predicate(c);if(c.animal&&!(prey&&found))continue;const path=[...node.path,c];if(found)return path;queue.push({cell:c,path});}}

}
function explore(ctx,a,predicate,prey=false){const path=foodPath(ctx.s,a,predicate,4,prey);if(!path||path[0].animal)return false;ctx.action={...ctx.action,targetPosition:observedPoint(path.at(-1)),path:path.map(observedPoint),movement:'walk',distance:1,reason:'近くに餌なし：4歩以内の餌へ岩・水辺・動物を避けて最短経路を1マス探索（採食は次の行動）'};move(ctx,a,path[0],'explore');stat(ctx,a.type+'Explorations');return true;}

const ACTION_PHASES=['decomposition','growth','herbivores','bee','predators','slug','status','reproduction','flower','germination','goal'];
const PHASE_LABELS={decomposition:'① ミミズ・痕跡',growth:'② キノコ発生',herbivores:'③ 草の競争',bee:'④ 訪花・散布',predators:'⑤ 捕食者',slug:'⑥ ナメクジ',status:'⑦ 空腹・毒・死亡',reproduction:'⑧ 繁殖',flower:'⑨ 開花',germination:'⑩ 種子の成長',goal:'⑪ 目標判定'};
function reproductionRules(st){return {enabled:false,mealsRequired:2,maxAlive:3,...st.reproduction};}
function phaseAnimals(s,types){return animals(s).filter(a=>!types||(Array.isArray(types)?types.includes(a.type):a.type===types)).sort((a,b)=>a.r-b.r||a.c-b.c);}
function isAlive(s,a){return cellAt(s,a.r,a.c)?.animal?.id===a.id;}
function point(a){return `${a.r+1}行${a.c+1}列`;}
function stat(ctx,key){ctx.s.stats[key]=(ctx.s.stats[key]||0)+1;}
// Observation metadata is read-only: it never enters targeting or goal evaluation.
function observedPoint(e){return e?{r:e.r,c:e.c}:null;}
function observedCell(c){return {r:c.r,c:c.c,terrain:c.terrain,plant:c.plant?{id:c.plant.id,type:c.plant.type}:null,animal:c.animal?{id:c.animal.id,type:c.animal.type}:null,trace:c.trace};}
function observedRecords(ctx){return [...ctx.s.logs.flatMap(l=>(l.records||[]).map(r=>({...r,turn:l.turn}))),...ctx.records.map(r=>({...r,turn:ctx.s.turn}))];}
function recordObservation(ctx,kind,actors,position,extra){

 if(['meal','predation'].includes(kind))link(all.findLast(r=>['disperse','growth','birth'].includes(r.kind)&&r.actors.includes(actors[1]?.id)||r.resourceId&&r.resourceId===extra.resourceId&&['growth'].includes(r.kind)),'利用した対象の発生');
 if(['growth','decompose'].includes(kind)){link(all.findLast(r=>r.kind==='death'&&same(r.position,position)),'同じ場所の死亡痕跡');if(kind==='decompose')o.reason='痕跡を先に利用・消費。キノコになる痕跡は残らない';else o.reason='残った痕跡＋空いた土 → キノコ';}

  o.actorPosition=observedPoint(a);o.reason=kind==='birth'?'上→右→下→左で最初の空いた土へ出生':extra.reason;
  link(all.findLast(r=>r.kind==='meal'&&r.actors[0]===a.id&&r.turn===ctx.s.turn),'親の今回の食事');
  for(const b of o.blockedBefore||[])if(b.plant?.type==='seed')link(all.findLast(r=>['seed-held','disperse'].includes(r.kind)&&r.actors.includes(b.plant.id)),'出生先に残っていた種子');
  if(kind==='birth'){const prior=all.findLast(r=>same(r.position,position)&&['meal','growth','germinate','disperse'].includes(r.kind));if(prior?.kind==='meal'&&prior.food==='seed')link(prior,'この出生先で種子を食べた記録');}
 }

  o.reason=kind==='bloom'?'周囲のナメクジが0匹になり開花':o.slugs?.length?'周囲にナメクジが残り、つぼみのまま':'前回もナメクジが不在：開花のきっかけなし';

}
function logEvent(ctx,kind,text,actors=[],position=null,extra={}){
 ctx.events.push(text);const observation=recordObservation(ctx,kind,actors,position,extra);
 if(['growth','disperse'].includes(kind)&&!extra.resourceId)extra={...extra,resourceId:cellAt(ctx.s,position.r,position.c)?.plant?.id};
 const record={phase:ctx.phase,kind,text,actors:actors.map(a=>a.id),position:observedPoint(position),...extra,eventId:`t${ctx.s.turn}.e${ctx.records.length}`,observation};ctx.records.push(record);

function move(ctx,a,c,cause){const from={r:a.r,c:a.c};cellAt(ctx.s,a.r,a.c).animal=null;a.r=c.r;a.c=c.c;c.animal=a;logEvent(ctx,'move',`${SPECIES[a.type].name}：${point(from)}から${point(a)}へ${cause==='jump'?'跳躍':cause==='water'?'水辺へ移動':'移動'}。`,[a],a,{from,cause});if(cause==='water')stat(ctx,'waterMoves');if(cause==='jump'){stat(ctx,'jumps');if(Math.abs(from.r-a.r)+Math.abs(from.c-a.c)===2&&cellAt(ctx.s,(from.r+a.r)/2,(from.c+a.c)/2)?.terrain==='water')stat(ctx,'waterJumps');}}

function st15FlowerSlugs(s,flowerId,snapshots=[]){
 const flower=s.cells.find(c=>c.plant?.id===flowerId&&c.plant.type==='flower')?.plant;
 if(!flower)return null;
 const rows=allObserved(s),ids=new Set();
 for(const state of [s,...snapshots]){
  for(const a of animals(state,'slug'))ids.add(a.id);
  for(const d of state.deaths||[])if(d.entity.type==='slug')ids.add(d.entity.id);
 }
 for(const row of rows){for(const [id,type] of Object.entries(row.observation?.actorTypes||{}))if(type==='slug')ids.add(id);if(row.kind==='birth'&&recordedType(row,row.parentId)==='slug')ids.add(row.childId);}
 const near=p=>p&&Number.isFinite(p.r)&&Number.isFinite(p.c)&&Math.abs(p.r-flower.r)+Math.abs(p.c-flower.c)<=1;
 const judgements=rows.filter(row=>row.actors.includes(flowerId)&&['bloom','flower-wait'].includes(row.kind));
 const slugs=[...ids].map(id=>{
  const identity=findIdentity(s,id),history=individualHistory(s,id,snapshots),events=rows.filter(row=>row.actors.includes(id)),contacts=[];
  const add=(turn,position)=>{if(near(position)&&!contacts.some(p=>p.turn===turn&&p.r===position.r&&p.c===position.c))contacts.push({turn,r:position.r,c:position.c});};
  // Every position is from an actual snapshot/event, including movement origins and child birth positions.
  for(const cycle of history?.cycles||[])add(cycle.turn,cycle.position);
  for(const row of events){add(row.turn,individualEventPosition(row,id));if(row.kind==='move'&&row.actors[0]===id)add(row.turn,row.from);}
  for(const row of judgements)for(const a of [...(row.observation?.slugs||[]),...(row.observation?.previousSlugs||[])])if(a.id===id)add(row.turn,a);
  const birth=rows.find(row=>row.kind==='birth'&&row.childId===id),death=events.find(row=>row.kind==='death')||identity?.death;
  return {id,history,contacts:contacts.sort((a,b)=>a.turn-b.turn),birth,death,entity:identity?.entity};
 });
 return {flower,judgements,slugs};
}

function individualHistory(s,id,snapshots=[]){
 const found=findIdentity(s,id);if(!found)return null;

 const start=entity.bornTurn||0,last=found.dead?found.death.turn:s.turn,cycles=[];
 for(let turn=start;turn<=last;turn++){
  const records=events.filter(r=>r.turn===turn),snapshot=snapshots.find(h=>h.turn===turn),at=snapshot?findIdentity(snapshot,id):null;
  let position=at?{r:at.entity.r,c:at.entity.c}:null;
  if(!position)for(const r of records){const p=individualEventPosition(r,id);if(p)position=p;}

}

const OPERATION_GUIDE_TEXTS=Object.freeze([

function createOperationGuide({eligible=false,onComplete=()=>{}}={}){
 let pending=eligible,step=0,visible=false;
 function finish(){pending=false;step=0;visible=false;onComplete();}
 return {
  get step(){return step;},get visible(){return visible;},
  get text(){return OPERATION_GUIDE_TEXTS[step];},
  sync({stageId,mode,conversation=false,ready=true}){
   if(stageId!=='renewal-1'){pending=false;step=0;}
   if(mode!=='placement')step=0;
   if(pending&&ready&&stageId==='renewal-1'&&mode==='placement'&&!conversation){pending=false;step=1;}
   visible=step>0&&ready&&stageId==='renewal-1'&&mode==='placement'&&!conversation;
   return visible;
  },
  action(kind){
   if(!visible)return;
   if(kind==='selected'&&step===1)step=2;
   else if(kind==='placed')step=3;
   else if(kind==='started')finish();
  },
  skip(){if(step>0)finish();},
  replay(){pending=false;step=1;},
  reset(){pending=true;step=0;visible=false;}
 };
}

function newlyPlaceableTypes(st,stages=STAGES){const index=stages.findIndex(s=>s.id===st.id),earlier=new Set(stages.slice(0,index).flatMap(s=>Object.keys(s.pool||{})));return Object.keys(st.pool||{}).filter(t=>!earlier.has(t));}

function failureDetails(s,st){
 const checks=conditions(s,st),missed=checks.map((g,index)=>({...g,index})).filter(g=>!g.met);
 return `<p class="failure-heading">${checks.length-missed.length}/${checks.length}条件を達成。未達成の条件：</p><ul class="failure-list">${missed.map(g=>`<li><button data-goal="${g.index}">🔎 ${g.label}</button><br>結果 ${g.current} ／ 必要 ${g.value}<span class="bad">（${g.current<g.value?'不足 '+(g.value-g.current):'超過 '+(g.current-g.value)}）</span></li>`).join('')}</ul>`;
}
function renderHints(st){
 const hints=STAGE_HINTS[st.id]||[st.brief,'生物を押すと行動ルールを確認できます。戻して動きをもう一度見てみよう。'];
 const shown=Math.min(ui.hintLevel,hints.length);
 return `<div class="hint-box"><strong>考える手掛かり（任意）</strong><p class="subtle">配置座標を直接示さず、連鎖を考える順番を確認できます。</p>
 ${hints.slice(0,shown).map((h,i)=>`<p><b>手掛かり${i+1}</b> ${h}</p>`).join('')}
 ${shown<hints.length?`<button id="showHint">${shown?'次の手掛かり':'手掛かりを開く'}（${shown+1}/${hints.length}）</button>`:'<span class="subtle">すべての手掛かりを表示中</span>'}</div>`;
}

function render(){
 const st=stage(),s=viewedState(),editing=ui.mode==='placement',selected=ui.selected?{type:ui.selected}:null;
 if(ui.trackedId){const found=findIdentity(s,ui.trackedId);if(found)ui.inspect=[found.entity.r,found.entity.c];else{ui.trackedId=null;ui.inspect=null;}}
 $('brief').innerHTML=`<span class="chapter-label">第${st.chapter}章 · ${chapterLabel(st)} · ${st.size}×${st.size}</span><h2>${st.title.slice(3)}</h2><p class="subtle">${st.brief}</p>`;
 $('stageInfo').innerHTML=`<strong>この箱庭のルール</strong><p>${stageRuleText(st)}</p><details><summary>生物と処理順を確認</summary><p>ミミズ→キノコ→草食→ハチ→捕食者→ナメクジ→状態→繁殖→開花→種子。同じグループは開始時の座標で上から左から。</p>${Object.entries(SPECIES).filter(([type])=>st.fixed.some(e=>e.type===type)||st.pool[type]||['slug','mushroom','flower'].includes(type)).map(([,d])=>`<p><b>${d.icon} ${d.name}</b>：${d.rule}</p>`).join('')}</details>`;
 $('hintPanel').innerHTML=renderHints(st);if($('showHint'))$('showHint').onclick=()=>{if(story.active||playback.active)return;ui.hintLevel++;render();};
 $('phase').textContent=editing?'01 / 生物を配置':s.status==='running'?'02 / 生態系を観察':s.status==='won'?'03 / 目標達成':'03 / 配置を再考';
 $('turn').textContent=`${s.turn} / ${st.limit} ターン（残り ${st.limit-s.turn}）`;
 $('goals').innerHTML=conditions(s,st).map((g,i)=>`<li><span class="${g.met?'ok':'bad'}">${g.met?'✓':'○'}</span> ${g.label}<br><span class="subtle">現在 ${g.current} ／ 目標 ${g.value}${g.min?'以上':''}</span><button class="goal-evidence" data-goal="${i}">${Number(st.id.split('-').at(-1))>=9?'関係・注意点と記録':'関連する出来事'}</button></li>`).join('');
 const budget=deploymentStatus(st,ui.placements);
 $('samePlacementNotice').hidden=!editing||!['renewal-14','renewal-15'].includes(st.id)||!sameExperimentLayout(st,ui.placements);
 $('samePlacementNotice').textContent='前回の実験と同じ配置です。結果を確認するため、そのまま再実験することもできます';
 $('inventoryWrap').dataset.slotCount='free';
 $('placementBudget').textContent=`配置 ${budget.total}個 ／ ${budget.min}〜${budget.max}個　あと${budget.max-budget.total}個まで${budget.total<budget.min?'（開始まであと'+(budget.min-budget.total)+'個）':''}`;
 $('inventory').innerHTML=Object.entries(st.pool).map(([type,cap])=>{const used=budget.used[type]||0,full=used>=cap;return `<button class="token ${ui.selected===type?'chosen':''} ${full?'at-limit':''}" data-type="${type}" data-limit-reached="${full}" aria-label="${SPECIES[type].name}：配置済み ${used}/${cap}個${full?'。上限に達しています。配置済みの駒は移動・撤去できます。':''}" ${!editing?'disabled':''}><span>${assetImage(type)} ${SPECIES[type].name}</span><small>配置済み ${used}/${cap}<br>${full?'上限到達':'残り '+(cap-used)+'個'}</small></button>`;}).join('');
 $('inventory').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if(story.active||playback.active)return;ui.inspectMode=false;ui.selected=b.dataset.type;ui.movingId=null;ui.newSpeciesIntro=null;ui.bubbleRequested=true;ui.bubbleDismissed=false;ui.placementGuideIntro=false;operationGuide.action('selected');const used=budget.used[ui.selected]||0,cap=st.pool[ui.selected];message=used>=cap?SPECIES[ui.selected].name+'は'+used+'/'+cap+'個配置済み（上限到達）。配置済みの同じ種類を選ぶと移動・撤去できます。':'薄い枠のマスへ配置。配置済みの同じ種類を押すと移動・撤去できます。';messageType=used>=cap?'error':'';render();});
 $('placedPieces').innerHTML=Object.entries(ui.placements).map(([id,e])=>`<button data-piece="${id}" ${!editing||story.active||playback.active?'disabled':''} class="${ui.movingId===id?'chosen':''}">${SPECIES[e.type].name} ${e.r+1},${e.c+1}</button>`).join('');
 $('placedPieces').querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{if(story.active||playback.active)return;ui.movingId=b.dataset.piece;ui.selected=ui.placements[ui.movingId].type;ui.inspectMode=false;tell('移動先を選ぶか「撤去」を押してください。');});

 $('board').style.setProperty?.('--board-size',st.size);

 $('board').innerHTML=s.cells.map(c=>renderCell(c,st,editing,selected)).join('');

 $('message').hidden=false;$('message').textContent=message;$('message').className='message '+messageType;
 $('result').innerHTML=s.status==='won'||s.status==='lost'?`<div class="result"><h2>${s.status==='won'?'標本箱に、ひとつの答え。':'もう一度、連鎖を考えよう。'}</h2><div class="subtle">${s.status==='won'?'全条件を制限ターン終了時に達成しました。':'未達成の目標と履歴を確認できます。巻き戻して原因を観察することもできます。'}</div>${s.status==='lost'?failureDetails(s,st):''}<button id="retry">同じステージに再挑戦</button>${s.status==='won'&&ui.index<STAGES.length-1?'<button id="nextstage" class="primary">次のステージへ</button>':''}</div>`:'';
 if($('retry'))$('retry').onclick=reset;if($('nextstage'))$('nextstage').onclick=()=>loadStage(ui.index+1);
 $('log').innerHTML=renderHistory(s);
 $('log').querySelectorAll('[data-log-turn]').forEach(d=>d.ontoggle=()=>{const n=+d.dataset.logTurn;if(!ui.state.logs.some(l=>l.turn===n))return;if(d.open){if(!ui.openLogs.includes(n))ui.openLogs.push(n);}else ui.openLogs=ui.openLogs.filter(t=>t!==n);});
 $('stateList').innerHTML=renderPopulation(s,st);
 renderInspector();
 for(const id of ['log','stateList'])$(id).querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>trackEntity(b.dataset.track));

}
function renderInspector(){
 if(experimentFinished(viewedState(),stage())&&ui.trackedId){$('inspector').innerHTML=renderIndividualHistory(viewedState(),ui.trackedId,ui.history);return;}
 if(!ui.inspect){$('inspector').textContent='マスをクリックすると、生物・空腹・痕跡を観察できます。';return;}
 const c=cellAt(viewedState(),...ui.inspect),rules=reproductionRules(stage());
 const graves=(viewedState().deaths||[]).filter(d=>d.entity.r===c.r&&d.entity.c===c.c);
 const tracked=ui.trackedId?findIdentity(viewedState(),ui.trackedId):null;
 $('inspector').innerHTML=`${tracked?`<div class="tracking-banner">追跡中：${SPECIES[tracked.entity.type].name} ${tracked.entity.id} ／ ${tracked.dead?'死亡':'生存'}</div>`:''}<div class="cell-meta"><strong>${c.r+1}行${c.c+1}列</strong><span>${c.terrain==='rock'?'岩：配置・移動不可':c.terrain==='water'?'水辺：カエルのみ進入可':isShore(viewedState(),c)?'岸：種子はターン末に+2':'土：種子はターン末に+1'} ／ 痕跡${c.trace?'あり（次ターン：ミミズの利用→空いた土ならキノコ）':'なし'}</span></div>`+
 [c.plant,c.animal].filter(Boolean).map(e=>`<section class="inspected-organism"><div class="organism-title"><strong>${organismIcon(e)} ${SPECIES[e.type].name} ${e.fixed?'［固定］':''}</strong></div>
 ${e.hunger!==undefined?`${statusBadges(e,stage())}<div class="observed-facts"><span>空腹 ${e.hunger} / ${RULES.starvation}</span><span>毒：${e.poisoned?'あり（状態更新時に死亡）':'なし'}</span><small>あと${RULES.starvation-e.hunger}回の連続欠食で死亡</small></div>`:''}
 ${e.type==='seed'?`<p>成長 ${e.growth}/2 ／ ターン末に${isShore(viewedState(),c)?'+2（岸）':'+1（土）'}。2以上で草になります。</p>`:''}${SPECIES[e.type].layer==='animal'?`<p class="food-web">食べる：${(SPECIES[e.type].foods||[]).map(t=>SPECIES[t]?.name||'死亡痕跡').join('・')}<br>食べられる：${(SPECIES[e.type].predators||[]).map(t=>SPECIES[t].name).join('・')||'この箱庭ではなし'}</p>`:''}${e.type==='flower'?`<div class="flower-note">${flowerObservation(viewedState(),e).text}</div>状態：${e.bloom?'開花済み':'つぼみ'} ／ 蜜 ${e.nectar}/2 ／ ${e.dispersed?'散布済み':'未散布'} ／ 前回の周囲：ナメクジ${e.previousSlug?'あり':'なし'}<br>`:''}
 ${['slug','aphid'].includes(e.type)&&rules.enabled?`対象の食事：${e.meals||0} / ${rules.mealsRequired}回<br>出産：${e.reproduced?'済み（一生に1回）':'未実施'} ／ 生存上限${rules.maxAlive}匹<br>`:''}
 ${e.parentId?`出生：${e.bornTurn}ターン目 ／ 親：${e.parentId}<br>`:''}
 ${observedEntityEvents(viewedState(),e.id)}<details><summary>行動ルール・個体ID</summary>${SPECIES[e.type].rule}<br><span class="subtle">個体ID：${e.id}</span></details></section>`).join('')+
 (!c.plant&&!c.animal?'<p class="subtle">現在このマスに生物はいません。</p>':'')+
 graves.map(d=>`<div class="death-card"><strong>${recordSignal({kind:'death',reason:d.reason})}${assetImage(d.entity)} ${SPECIES[d.entity.type].name} ${d.entity.id}：T${d.turn}に${d.reason}</strong><br>死亡時の空腹 ${d.entity.hunger}/3 ／ 毒${d.entity.poisoned?'あり':'なし'}${d.entity.type==='slug'&&rules.enabled?`<br>通常キノコの食事 ${d.entity.meals||0}回 ／ ${d.entity.reproduced?'出産済み':'出産前'}`:''}${d.entity.parentId?`<br>親：${d.entity.parentId} ／ T${d.entity.bornTurn}出生`:''}<p class="subtle">痕跡は翌ターンにミミズが先に利用します。残った痕跡は植物枠が空いた土ならキノコへ。水辺では残ります。</p></div>`).join('');
}

function clickCell(r,c){
 if(story.active||playback.active)return;ui.trackedId=null;ui.inspect=[r,c];
 if(ui.mode!=='placement'||ui.inspectMode){inspectCell(r,c);return;}
 if(!ui.selected)return;
 const existing=Object.entries(ui.placements).find(([,e])=>e.r===r&&e.c===c&&e.type===ui.selected);
 if(!ui.movingId&&existing){ui.movingId=existing[0];tell('移動先を選ぶか「撤去」を押してください。');return;}
 const id=ui.movingId||'p'+(++ui.placementSeq),next={...ui.placements,[id]:{type:ui.selected,r,c}};
 try{ui.state=createInitial(stage(),next);ui.placements=next;ui.movingId=null;ui.bubbleDismissed=true;operationGuide.action('placed');saveCurrentSession({defer:true});tell(`${SPECIES[ui.selected].name}を${r+1}行${c+1}列に配置しました。${completePlacement(stage(),next)?'「開始」で実験できます。':'配置予算を確認して組み合わせを選ぼう。'}`);}catch(e){tell(e.message,true);}
}
function loadStage(i,{withConversation=true}={}){if(story.active)return false;if(!STAGES[i]||!story.progress.unlockedIds.includes(STAGES[i].id)){$('stage').value=String(ui.index);tell('前のステージをクリアすると解放されます。',true);return false;}cancelPresentation();guideNarrativeReady=false;ui=newSession(i);if(i===0&&!story.progress.operationGuideSeen&&!story.progress.clearedIds.includes('renewal-1'))operationGuide.reset();$('stage').value=i;saveCurrentSession();tell('生物を選んで、合法なマスへ配置してください。');if(withConversation)story.enterStage(stage());guideNarrativeReady=true;render();}
// Reuse the same controls and board labels in a compact PC workbench.
function setupDesktopLayout(){
 if(typeof window==='undefined'||!window.matchMedia||!document.createComment)return;
 const query=window.matchMedia('(min-width: 1101px)'),wide=window.matchMedia('(min-width: 1500px)');
 const panel=$('desktopControls'),topbar=$('desktopTopbar');
 const nodes=['boardHeading','goalSummary','stageToolbar','inventoryWrap','onboarding','quickHint','playFeedback','message','autosaveWarning'].map(id=>{
  const node=$(id),anchor=document.createComment('mobile-position-'+id);node.before(anchor);return {id,node,anchor};
 });
 function arrange(){
  panel.hidden=!query.matches;topbar.hidden=!query.matches;
  if(query.matches){
   const right=document.querySelector('.right');
   right.prepend(panel);
   $('infoDrawer').open=true;$('populationDetails').open=true;
  }
  for(const {id,node,anchor} of nodes){
   if(query.matches){
    if(['boardHeading','goalSummary','stageToolbar'].includes(id))topbar.append(node);
    else if(id==='inventoryWrap')$('selectionMount').append(node);
    else if(id==='message')$('placementFeedback').append(node);
    else if(id==='quickHint')panel.append(node);
    else panel.append(node);
   }else anchor.after(node);
  }
 }
 arrange();query.addEventListener?.('change',arrange);wide.addEventListener?.('change',arrange);
}

 $('logTurn').onchange=e=>{ui.logFilter=e.target.value;render();};
 if(typeof window!=='undefined'&&window.matchMedia?.('(max-width: 700px)').matches)$('infoDrawer').open=false;
 $('restartGame').onclick=()=>restartFromBeginning();
 $('closePlacementBubble').onclick=()=>{ui.newSpeciesIntro=null;ui.bubbleDismissed=true;ui.placementGuideIntro=false;if(operationGuide.visible)operationGuide.skip();$('placementBubble').hidden=true;render();};
